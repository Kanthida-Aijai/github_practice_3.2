<!DOCTYPE html> 
<html lang="th"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>ติดต่อ & จองคิว - Bella Salon</title> 
    <link rel="stylesheet" href="style.css"> 
  </head> 
  <body> 
    <!-- Navigation --> 
    <nav> 
      <div class="logo">
        <span class="logo-icon">✂</span> Bella Salon
      </div>
      <div class="nav-links">
        <a href="index.html">หน้าแรก</a> 
        <a href="page2.html" class="active">ติดต่อ / จองคิว</a> 
      </div>
    </nav> 

    <!-- Page Content --> 
    <main> 
      <section class="booking-section">
        <!-- Section Header -->
        <div class="section-title">
          <p class="sub-title">Contact & Booking</p>
          <h1>ติดต่อ & จองคิว</h1>
        </div>

        <!-- Section Content (Grid 2 Columns) -->
        <div class="booking-container">
          
          <!-- Left Column: Contact Info & Map -->
          <div class="contact-info">
            <h2>ข้อมูลติดต่อ</h2>
            
            <ul class="info-list">
              <li>
                <div class="icon-bg">📍</div>
                <div>123 ถ.สุขุมวิท แขวงคลองเตย<br>เขตคลองเตย กรุงเทพฯ 10110</div>
              </li>
              <li>
                <div class="icon-bg">📞</div>
                <div>02-123-4567</div>
              </li>
              <li>
                <div class="icon-bg">🕒</div>
                <div>ทุกวัน 10:00 - 20:00 น.</div>
              </li>
            </ul>

            <!-- Google Maps Embed/Image Container -->
            <div class="map-container">
              <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15504.60670984813!2d100.5018!3d13.7042!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTPCsDQyJzA1LjEiTiAxMDDCsDMwJzA2LjUiRQ!5e0!3m2!1sth!2sth!4v1620000000000!5m2!1sth!2sth" 
                width="100%" 
                height="220" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy">
              </iframe>
            </div>
          </div>

          <!-- Right Column: Online Booking Form -->
          <div class="booking-form-container">
            <h2>จองคิวออนไลน์</h2>
            <form class="booking-form">
              <div class="form-group">
                <label for="fullname">ชื่อ-นามสกุล</label>
                <input type="text" id="fullname" placeholder="กรุณากรอกชื่อของคุณ" required>
              </div>

              <div class="form-group">
                <label for="phone">เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" placeholder="0XX-XXX-XXXX" required>
              </div>

              <div class="form-group">
                <label for="service">บริการที่ต้องการ</label>
                <input type="text" id="service" placeholder="เช่น ตัดผม, ทำสี, ทำเล็บ">
              </div>

              <div class="form-group">
                <label for="message">ข้อความเพิ่มเติม</label>
                <textarea id="message" rows="5" placeholder="วัน /เวลาที่สะดวก หรือรายละเอียดเพิ่มเติม"></textarea>
              </div>

              <button type="submit" class="btn-submit">ส่งข้อความ</button>
            </form>
          </div>

        </div>
      </section>
    </main> 

    <!-- Footer --> 
    <footer> 
      <div class="footer-logo">
        <span class="logo-icon">✂</span> Bella Salon
      </div>
      <p>© 2026 Bella Salon. All rights reserved.</p>
    </footer> 
  </body> 
</html>
